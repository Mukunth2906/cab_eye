// =====================================================================================
//  Cab Eye — Backend build file
//
//  EXACT VERSIONS TARGETED (do not bump casually; these are a tested-together set):
//    Gradle ......................... 8.11.1   (see gradle/wrapper/gradle-wrapper.properties)
//    Spring Boot plugin ............. 3.3.5
//    Spring dependency-management ... 1.1.6
//    Java source/target ............. 17       (compiled and run by Android Studio's JBR 21)
//
//  Starters: `web`, `websocket` and `jdbc`. Durable data (accounts, memory, feedback, rides,
//  payment orders) is in a database — H2 inside the backend on the laptop, PostgreSQL when
//  deployed. Live connections are still a ConcurrentHashMap inside RideSessionManager.
// =====================================================================================

plugins {
    id 'java'
    id 'eclipse'
    id 'org.springframework.boot'            version '3.3.5'
    id 'io.spring.dependency-management'     version '1.1.6'
}

group   = 'com.cabeye'
version = '0.1.0-SNAPSHOT'

// NOTE: deliberately NOT using a Gradle `toolchain { }` block. Toolchain resolution tries
// to auto-provision a JDK on first run, which is a common and confusing failure on a
// fresh machine. Plain source/target compatibility compiled by whatever JDK 17+ is
// running Gradle (here: Android Studio's bundled JBR 21) is far more predictable.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Required by the brief -------------------------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // --- Database ---------------------------------------------------------------------
    // Plain JDBC (JdbcTemplate + HikariCP). On the laptop the database is H2: it runs inside
    // this backend and keeps everything in backend/data/cabeye.mv.db — nothing to install.
    // When deployed, the same code talks to PostgreSQL (set CABEYE_DB_URL). Versions come from
    // Spring Boot's managed dependency set.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // Admin alert emails through Gmail (free, app password). Idle unless spring.mail.host is set.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // --- Razorpay (real payment gateway) -----------------------------------------------
    // Used when cabeye.razorpay.key-id/key-secret are set. Falls back to the sandbox mock
    // when they are blank. The SDK handles order creation, signature verification and the
    // REST calls so we don't hand-roll auth headers.
    implementation 'com.razorpay:razorpay-java:1.4.10'

    // --- Redis & Cluster Support (Phase 1 & 3) ----------------------------------------
    // For cross-instance WebSocket event propagation, driver GPS caching, and distributed OTPs.
    // Gracefully idle if Redis is not configured (maintains local H2 zero-dependency mode).
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-pool2'

    // --- Production Health & Metrics (Phase 1 & 6) ------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Test (harmless; lets `gradlew test` succeed rather than error on no config) ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Tests never touch the real database in backend\data: any test that does not pick its own
    // folder gets a throwaway one under build\.
    systemProperty 'cabeye.data.dir', layout.buildDirectory.dir('test-data/default').get().asFile.path
    // ...and never read your real secrets: a test must not log in as you or message your Telegram.
    systemProperty 'cabeye.secrets.file', layout.buildDirectory.file('no-secrets.properties').get().asFile.path
}

// Make the console output UTF-8 on Windows so log arrows/box characters don't mojibake.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
