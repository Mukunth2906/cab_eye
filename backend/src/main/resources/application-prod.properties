# =====================================================================================
#  Cab Eye Production Profile Configuration (`prod`)
#  Target: AWS Mumbai (ap-south-1) ALB -> Spring Boot Containers -> RDS + ElastiCache
# =====================================================================================

# ---- Security & Hardening -----------------------------------------------------------
# Disable H2 console in production
spring.h2.console.enabled=false

# Never expose dev OTP codes in API responses in production
cabeye.auth.otp.expose=false
cabeye.dev.memory-simulator=false

# Disable debug endpoints
cabeye.debug.token=

# ---- Database (RDS PostgreSQL) ------------------------------------------------------
cabeye.db.max-pool=${CABEYE_DB_MAX_POOL:20}
cabeye.db.min-idle=${CABEYE_DB_MIN_IDLE:5}
cabeye.db.connection-timeout-ms=30000
cabeye.db.idle-timeout-ms=600000
cabeye.db.max-lifetime-ms=1800000
cabeye.db.leak-threshold-ms=10000

# ---- Redis & Cluster Fanout (ElastiCache) -------------------------------------------
cabeye.redis.enabled=true

# ---- Logging & CloudWatch -----------------------------------------------------------
# Avoid high-frequency GPS log flooding at INFO level
logging.level.root=WARN
logging.level.com.cabeye.backend=INFO
logging.level.com.cabeye.backend.websocket.RideWebSocketHandler=INFO
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=WARN

# Structured single-line logs for CloudWatch ingestion
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n

# ---- Tomcat & Networking ------------------------------------------------------------
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=120000
server.forward-headers-strategy=native

# ---- Actuator & Observability -------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
