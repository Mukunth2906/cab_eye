# =====================================================================================
#  Cab Eye backend configuration.
# =====================================================================================

spring.application.name=cabeye-backend

# -------------------------------------------------------------------------------------
#  Profiles
#
#  `dev` is the default so a local run has the debug tooling. It is the ONLY profile in
#  which /debug/broadcast exists at all — the controller is annotated @Profile("dev"), so
#  under any other profile the bean is never created and the route genuinely does not
#  exist. That is layer 1 of three; see DebugController's javadoc.
#
#  To run without it (the "release build" case):
#      gradlew bootRun --args="--spring.profiles.active=prod"
# -------------------------------------------------------------------------------------
spring.profiles.active=dev

# -------------------------------------------------------------------------------------
#  Debug token (layer 2)
#
#  Read from the CABEYE_DEBUG_TOKEN environment variable. Empty means the endpoint refuses
#  everything with 404 — an unset secret fails CLOSED, because a debug endpoint that opens
#  itself when misconfigured is worse than one that never existed.
#
#  PowerShell:  $env:CABEYE_DEBUG_TOKEN = "some-long-random-string"
# -------------------------------------------------------------------------------------
cabeye.debug.token=${CABEYE_DEBUG_TOKEN:}

# -------------------------------------------------------------------------------------
#  Server
# -------------------------------------------------------------------------------------

# Port 8080. If something else on your PC already uses 8080, change it here AND change the
# `adb reverse` command / the ngrok port in share-with-friends.ps1 to match.
server.port=8080

# Bind on all interfaces, not just 127.0.0.1. Costs nothing over the USB `adb reverse`
# tunnel, and means the same build works over Wi-Fi and through ngrok without a change.
server.address=0.0.0.0

# Keep WebSocket connections alive through idle periods (the rider app holds one open for
# the whole ride, and the `finding` state can be quiet for a while).
server.tomcat.connection-timeout=120000

# ngrok and most reverse proxies terminate TLS and forward the original scheme and client
# IP in these headers. Without this, Spring believes every request arrived over plain HTTP
# from 127.0.0.1 — which would make the debug endpoint's caller-IP log useless precisely
# when it matters most, i.e. when the server is reachable from the open internet.
server.forward-headers-strategy=native

# -------------------------------------------------------------------------------------
#  Logging
# -------------------------------------------------------------------------------------
logging.level.com.cabeye.backend=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-42logger{42} : %msg%n
