# =====================================================================================
#  Cab Eye backend configuration.
# =====================================================================================

spring.application.name=cabeye-backend

# -------------------------------------------------------------------------------------
#  Profiles
#
#  `dev` is the default so a local run has the debug tooling. It is the ONLY profile in
#  which /debug/broadcast exists at all — the controller is annotated @Profile("dev"), so
#  under any other profile the bean is never created and the route genuinely does not
#  exist. That is layer 1 of three; see DebugController's javadoc.
#
#  To run without it (the "release build" case):
#      gradlew bootRun --args="--spring.profiles.active=prod"
# -------------------------------------------------------------------------------------
spring.profiles.active=dev

# -------------------------------------------------------------------------------------
#  Debug token (layer 2)
#
#  Read from the CABEYE_DEBUG_TOKEN environment variable. Empty means the endpoint refuses
#  everything with 404 — an unset secret fails CLOSED, because a debug endpoint that opens
#  itself when misconfigured is worse than one that never existed.
#
#  PowerShell:  $env:CABEYE_DEBUG_TOKEN = "some-long-random-string"
# -------------------------------------------------------------------------------------
cabeye.debug.token=${CABEYE_DEBUG_TOKEN:}

# -------------------------------------------------------------------------------------
#  Server
# -------------------------------------------------------------------------------------

# Port 8080. If something else on your PC already uses 8080, change it here AND change the
# `adb reverse` command / the ngrok port in share-with-friends.ps1 to match.
server.port=8080

# Bind on all interfaces, not just 127.0.0.1. Costs nothing over the USB `adb reverse`
# tunnel, and means the same build works over Wi-Fi and through ngrok without a change.
server.address=0.0.0.0

# Keep WebSocket connections alive through idle periods (the rider app holds one open for
# the whole ride, and the `finding` state can be quiet for a while).
server.tomcat.connection-timeout=120000

# ngrok and most reverse proxies terminate TLS and forward the original scheme and client
# IP in these headers. Without this, Spring believes every request arrived over plain HTTP
# from 127.0.0.1 — which would make the debug endpoint's caller-IP log useless precisely
# when it matters most, i.e. when the server is reachable from the open internet.
server.forward-headers-strategy=native

# -------------------------------------------------------------------------------------
#  Logging
# -------------------------------------------------------------------------------------
logging.level.com.cabeye.backend=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-42logger{42} : %msg%n

# -------------------------------------------------------------------------------------
#  Accounts, sign-in and rider memory
#
#  Accounts, sessions, trip memory, feedback and scheduled rides are kept as JSON files in
#  this folder so they survive a restart. Delete the folder to start from a clean slate.
# -------------------------------------------------------------------------------------
cabeye.data.dir=${CABEYE_DATA_DIR:data}

# ---- Database -------------------------------------------------------------------------
# Blank URL = H2 on this machine, stored in <cabeye.data.dir>/cabeye.mv.db (see DatabaseConfig).
# When deployed, point it at PostgreSQL, e.g. jdbc:postgresql://localhost:5432/cabeye
cabeye.db.url=${CABEYE_DB_URL:}
cabeye.db.user=${CABEYE_DB_USER:sa}
cabeye.db.password=${CABEYE_DB_PASSWORD:}
# Browse the H2 database at http://localhost:8080/h2-console (only reachable from this laptop).
# Turn off when deployed: CABEYE_H2_CONSOLE=false
spring.h2.console.enabled=${CABEYE_H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Mock OTP: there is no SMS provider yet. While this is true the one-time code is returned
# to the app in the /auth/otp response (and always written to this log) so sign-in works in
# a demo. Set CABEYE_OTP_EXPOSE=false before exposing the backend to anyone else.
cabeye.auth.otp.expose=${CABEYE_OTP_EXPOSE:true}

# -------------------------------------------------------------------------------------
#  Admin website, alerts (Telegram + email)
#
#  Secrets live in backend\cabeye-secrets.properties, which git ignores. Copy
#  cabeye-secrets.example.properties to that name and fill it in. Environment variables work
#  too (CABEYE_ADMIN_EMAIL, CABEYE_ADMIN_PASSWORD, CABEYE_TELEGRAM_BOT_TOKEN, ...).
# -------------------------------------------------------------------------------------
spring.config.import=optional:file:${cabeye.secrets.file:./cabeye-secrets.properties}

cabeye.admin.email=${CABEYE_ADMIN_EMAIL:}
cabeye.admin.password=${CABEYE_ADMIN_PASSWORD:}
# Where alert links point. Change to the https address once deployed.
cabeye.admin.url=${CABEYE_ADMIN_URL:http://localhost:8080/admin/}
cabeye.telegram.bot-token=${CABEYE_TELEGRAM_BOT_TOKEN:}

# Gmail SMTP defaults; only used once spring.mail.host/username/password are set.
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
