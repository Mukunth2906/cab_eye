# =====================================================================================
#  Cab Eye secrets — copy this file to  cabeye-secrets.properties  (same folder) and fill in.
#  cabeye-secrets.properties is ignored by git: it must never be committed or shared.
# =====================================================================================

# ---- Admin website login (http://localhost:8080/admin) --------------------------------
cabeye.admin.email=
# At least 8 characters. Use something you don't use anywhere else.
cabeye.admin.password=

# ---- Telegram alerts (SOS + urgent feedback on your phone) ---------------------------
# 1. In Telegram, open @BotFather, send /newbot, pick a name and a username ending in "bot".
# 2. Paste the token it gives you here. Then link your chat from the admin website: Settings.
cabeye.telegram.bot-token=

# ---- Email alerts (Gmail) -----------------------------------------------------------
# Needs 2-Step Verification on the Gmail account, then an App password:
#   Google Account > Security > 2-Step Verification > App passwords > create "Cab Eye".
# Paste the 16-letter app password below (not your normal Gmail password).
# Alerts are sent FROM this Gmail TO cabeye.admin.email above (they can be the same).
spring.mail.host=smtp.gmail.com
spring.mail.username=
spring.mail.password=

# ---- Razorpay (payment gateway) -----------------------------------------------------
# Get your keys from https://dashboard.razorpay.com/app/keys
# Use rzp_test_... keys for sandbox testing. Switch to rzp_live_... for production.
# Leave blank to use the built-in mock gateway (no real money, no bank).
cabeye.razorpay.key-id=
cabeye.razorpay.key-secret=

# ---- Grok (optional: the mind map's free-form interpreter) ---------------------------
# When a rider says something about a place the phone's rules don't understand, and they have
# agreed, that one sentence is sent here and read by Grok (xAI). Get a key at console.x.ai.
# Leave blank to keep the app rules-only (the endpoint then answers 404).
cabeye.grok.api-key=
# cabeye.grok.model=grok-4.7
# cabeye.grok.url=https://api.x.ai/v1/chat/completions
# cabeye.grok.timeout-ms=4000

# ---- OpenStreetMap (real map data, no key) ----------------------------------------------
# Area names and well-known places for the rider's mind map. On by default against the public
# servers, which are for light use: for many riders, run your own or use a provider.
# cabeye.osm.enabled=true
# cabeye.osm.nominatim-url=https://nominatim.openstreetmap.org
# cabeye.osm.overpass-url=https://overpass-api.de/api/interpreter,https://z.overpass-api.de/api/interpreter

# ---- SMS for sign-in codes (optional) ------------------------------------------------
# With none of these set, sign-in codes are NOT texted: the code is shown in the app as an
# incoming message (demo mode). Fill in ONE provider to text real codes to real phones; the
# app then reads the code from the incoming SMS by itself (the rider taps "Allow" once).
#
# Twilio (works worldwide; a trial account only texts numbers you verified in its console):
#   console.twilio.com > Account SID, Auth token, and a Twilio phone number (or MG... service SID)
cabeye.sms.twilio.account-sid=
cabeye.sms.twilio.auth-token=
cabeye.sms.twilio.from=
#
# Fast2SMS (India only, Quick SMS route, no DLT template needed): fast2sms.com > Dev API > key
cabeye.sms.fast2sms.api-key=
#
# auto = Twilio if set, else Fast2SMS if set, else no SMS. Or force: twilio | fast2sms | none
# cabeye.sms.provider=auto

# ---- Gemini: the camera's "what's in front of me" + the mind map's sentence reader ---------
# Keys from https://aistudio.google.com/apikey (free tier). Several keys, comma-separated, are
# tried in turn when one hits its rate limit; models fall back from the fastest to the more
# capable. Without a key the phone uses its own on-device object detector instead.
cabeye.gemini.api-keys=
# cabeye.gemini.models=gemini-3.5-flash-lite,gemini-3.5-flash,gemini-2.5-flash
