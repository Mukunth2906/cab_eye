// =====================================================================================
//  Cab Eye — Android root build file
//
//  EXACT VERSIONS TARGETED (a tested-together set; changing one usually means changing
//  another, so treat these as a unit):
//    Gradle ......................... 8.11.1  (gradle/wrapper/gradle-wrapper.properties)
//    Android Gradle Plugin .......... 8.7.3
//    Kotlin ......................... 2.0.21
//    Kotlin Compose compiler plugin . 2.0.21  (must ALWAYS equal the Kotlin version)
//    Compose BOM .................... 2024.10.01
//    compileSdk / targetSdk ......... 35
//    minSdk ......................... 26
//    JVM target ..................... 17
//
//  From Kotlin 2.0 onward the Compose compiler ships as its own Gradle plugin
//  (`org.jetbrains.kotlin.plugin.compose`) and is versioned in lockstep with Kotlin.
//  The old `composeOptions { kotlinCompilerExtensionVersion ... }` block is gone — adding
//  it back will break the build.
// =====================================================================================

plugins {
    id 'com.android.application'            version '8.7.3'  apply false
    id 'org.jetbrains.kotlin.android'       version '2.3.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0' apply false
}
