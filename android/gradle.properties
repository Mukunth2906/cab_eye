# Memory for the Gradle daemon. 2 GB is enough for this module and avoids the
# out-of-memory failures the 512 MB default produces on Compose builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build faster: run independent tasks in parallel and reuse task outputs between builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by Compose. Both lines are mandatory.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
